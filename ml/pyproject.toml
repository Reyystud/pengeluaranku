[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sei-ml"
version = "0.0.0"
description = "Shared ML library: preprocessing, features, models, evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
    "pandas",
    "pandera",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "joblib>=1.6.0",
]

[tool.setuptools]
package-dir = {"ml" = "."}
packages = ["ml", "ml.preprocessing", "ml.features", "ml.classification", "ml.anomaly_detection", "ml.forecasting", "ml.clustering", "ml.recurring", "ml.evaluation", "ml.eda", "ml.schemas"]
