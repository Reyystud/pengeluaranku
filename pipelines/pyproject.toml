[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sei-pipelines"
version = "0.0.0"
description = "ML pipelines (Prefect flows)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sei-ml",
    "sei-data-generator",
    "mlflow>=3.18.0",
    "numpy",
    "pyarrow",
    "pandas>=3.1.1",
    "prefect>=3,<4",
    "evidently>=0.7.23",
]

[tool.setuptools]
package-dir = {"pipelines" = "."}
packages = ["pipelines"]
