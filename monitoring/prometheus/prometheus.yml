# Local Prometheus (PRD 18.1, 19.1, profile `observability`). In GCP the system layer uses Cloud
# Monitoring (infrastructure/terraform/monitoring.tf) instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
        labels: {service: backend}
  - job_name: worker
    static_configs:
      - targets: ["worker:8000"]
        labels: {service: worker}
  - job_name: ml-service
    static_configs:
      - targets: ["ml-service:8080"]
        labels: {service: ml-service}
