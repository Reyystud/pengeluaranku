# Period-end expense forecast (PRD 7.7). Versioned: bump `version` with any value change.
# Business code never hardcodes these (PRD 0.3 rule 3). "decision" = see docs/DECISIONS.md (T-24).
version: run-rate-1
min_history_days: 14          # below this: not shown (7.7.2)
personal_history_days: 60     # from here: seasonal naive (7.7.2) and per-category forecasts (7.7 FR-07.01)
min_category_transactions: 20 # FR-07.01
spread_window_days: 60        # decision: window of daily spend used for the P10/P90 spread
interval:
  z: 1.2816                   # standard normal 90th percentile (P10/P90 of the total)
  spread_divisor: 2.5631      # decision: 2 * z, turns (P90 - P10) of daily spend into a std-like spread
seasonal_naive:
  weeks: 4                    # same weekday, last 4 weeks (7.7.2)
cache:
  max_age_hours: 6            # FR-07.07
  keep_per_series: 30         # PRD 12: latest 30 per (user, period, category)
