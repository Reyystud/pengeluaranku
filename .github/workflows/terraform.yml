name: terraform

# PRD 19.5: fmt, validate and the offline guardrail tests on every change under infrastructure/;
# plan on pull requests and apply on main (approval environment `demo`) only once the repository
# variables below exist. Without them only the `check` job runs.
#
# Repository variables for plan/apply: TF_STATE_BUCKET, TF_WIF_PROVIDER, TF_SERVICE_ACCOUNT,
# GCP_PROJECT_ID, GCP_BILLING_ACCOUNT_ID, MONTHLY_BUDGET_IDR, ALERT_EMAIL.
# TF_SERVICE_ACCOUNT is a service account you create yourself for Terraform; it is not the
# deployer account that infrastructure/terraform creates (README "Plan and apply from CI").
on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"

jobs:
  check:
    name: fmt, validate, guardrail tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  plan:
    name: plan
    if: github.event_name == 'pull_request' && vars.TF_STATE_BUCKET != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_monthly_budget_idr: ${{ vars.MONTHLY_BUDGET_IDR }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
          {
            echo '### terraform plan'
            echo '```'
            tail -n 200 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != ''
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: demo # required reviewers on this environment are the approval step
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_monthly_budget_idr: ${{ vars.MONTHLY_BUDGET_IDR }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TF_WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -input=false -auto-approve -lock-timeout=60s
